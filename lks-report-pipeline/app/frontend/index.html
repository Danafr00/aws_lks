<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Pipeline</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #1f2933; }
  h1 { font-size: 1.4rem; }
  nav button { padding: 8px 14px; border: 1px solid #9aa5b1; background: #fff; cursor: pointer; }
  nav button.active { background: #1f2933; color: #fff; }
  section { display: none; margin-top: 16px; }
  section.active { display: block; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
  textarea { height: 200px; font-family: monospace; }
  button.action { margin-top: 12px; padding: 8px 16px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 0.9rem; }
  th, td { border: 1px solid #cbd2d9; padding: 6px 8px; text-align: left; }
  .msg { margin-top: 10px; font-weight: 600; }
  .ok { color: #137333; } .err { color: #b3261e; } .wait { color: #8a6d00; }
</style>
</head>
<body>
<h1>Report Pipeline</h1>

<nav>
  <button data-tab="upload" class="active">Upload report</button>
  <button data-tab="reports">Reports</button>
  <button data-tab="status">Check status</button>
</nav>

<section id="upload" class="active">
  <p>Choose a JSON report or edit the text below. It is uploaded straight to S3 and processed automatically.</p>
  <input type="file" id="file" accept=".json,application/json">
  <label for="text">Report JSON</label>
  <textarea id="text">{
  "filename": "sales-web.json",
  "data": [
    {"item": "Notebook", "qty": 10, "price": 15000},
    {"item": "Pen", "qty": 25, "price": 3500}
  ]
}</textarea>
  <button class="action" id="uploadBtn">Upload</button>
  <div class="msg" id="uploadMsg"></div>
</section>

<section id="reports">
  <button class="action" id="refreshBtn">Refresh</button>
  <div id="reportList">-</div>
</section>

<section id="status">
  <label for="reportId">Report id</label>
  <input id="reportId" placeholder="e.g. 6f1c...json">
  <button class="action" id="statusBtn">Check</button>
  <div class="msg" id="statusMsg"></div>
</section>

<script>
const API = "__API_GATEWAY_URL__";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = (el, text, cls) => { el.textContent = text; el.className = "msg " + cls; };

document.querySelectorAll("nav button").forEach((btn) => btn.addEventListener("click", () => {
  document.querySelectorAll("nav button, section").forEach((e) => e.classList.remove("active"));
  btn.classList.add("active");
  $(btn.dataset.tab).classList.add("active");
  if (btn.dataset.tab === "reports") loadReports();
}));

$("file").addEventListener("change", async (e) => { if (e.target.files[0]) $("text").value = await e.target.files[0].text(); });

async function checkStatus(id) {
  const res = await fetch(API + "/reports/" + encodeURIComponent(id));
  if (res.status === 404) return null;
  return res.json();
}

async function waitForResult(id) {
  for (let i = 0; i < 20; i++) {                       // poll every 3 seconds, up to one minute
    await new Promise((r) => setTimeout(r, 3000));
    const s = await checkStatus(id);
    if (s && s.status !== "PROCESSING") return s;
    say($("uploadMsg"), `Processing ${id} ... (${s ? s.status : "waiting for the workflow to start"})`, "wait");
  }
  return null;
}

$("uploadBtn").addEventListener("click", async () => {
  try {
    const first = await fetch(API + "/upload-url");              // 1) ask the API for a presigned URL
    const { upload_url, report_id } = await first.json();
    const put = await fetch(upload_url, {                        // 2) PUT the file straight to S3
      method: "PUT", headers: { "Content-Type": "application/json" }, body: $("text").value,
    });
    if (!put.ok) return say($("uploadMsg"), `S3 answered ${put.status}`, "err");
    $("reportId").value = report_id;
    say($("uploadMsg"), `Uploaded as ${report_id}. Processing ...`, "wait");
    const result = await waitForResult(report_id);                // 3) watch the status in DynamoDB
    if (!result) say($("uploadMsg"), "No final status yet. Open 'Check status' in a moment.", "err");
    else say($("uploadMsg"), `${report_id}: ${result.status}${result.message ? " - " + result.message : ""}`, result.status === "DONE" ? "ok" : "err");
  } catch (e) { say($("uploadMsg"), "Upload failed: " + e.message, "err"); }
});

async function loadReports() {
  const rows = await fetch(API + "/reports").then((r) => r.json());
  $("reportList").innerHTML = rows.length
    ? "<table><tr><th>Report id</th><th>File</th><th>Records</th><th>Total</th><th>Created (UTC)</th></tr>" +
      rows.map((r) => `<tr><td>${esc(r.report_id)}</td><td>${esc(r.filename)}</td><td>${esc(r.record_count)}</td><td>${esc(r.total_amount)}</td><td>${esc(r.created_at)}</td></tr>`).join("") + "</table>"
    : "No reports yet.";
}
$("refreshBtn").addEventListener("click", loadReports);

$("statusBtn").addEventListener("click", async () => {
  const s = await checkStatus($("reportId").value.trim());
  if (!s) return say($("statusMsg"), "Report not found.", "err");
  say($("statusMsg"), `${s.status}${s.message ? " - " + s.message : ""} (updated ${s.updated_at || "?"})`, s.status === "DONE" ? "ok" : "wait");
});
</script>
</body>
</html>
